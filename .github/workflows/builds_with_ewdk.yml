name: libusbK builds with EWDK

on: [push, pull_request]

jobs:
  build-project:
    name: Build Targets (Windows 11 / 24H2+)
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild Configuration
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)' # Targets Visual Studio 2022 Build Env

      - name: Setup NuGet Environment
        uses: NuGet/setup-nuget@v2

      # Install exact WDK targets directly into the libusbK subdirectory 
      - name: Restore WDK Packages & Build Elements
        shell: powershell
        working-directory: libusbK
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version 10.0.26100.2454 -OutputDirectory packages
          nuget install Microsoft.Windows.SDK.CPP.x64 -Version 10.0.26100.2454 -OutputDirectory packages

      - name: Build User Libraries
        shell: cmd
        working-directory: libusbK
        run: |
          echo === Building x86 User Space Libs ===
          msbuild src\lib\libusbK_lib.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="10.0.26100.0" /m

          echo === Building x64 User Space Libs ===
          msbuild src\lib\libusbK_lib.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="10.0.26100.0" /m

          echo === Building ARM64 User Space Libs ===
          msbuild src\lib\libusbK_lib.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="10.0.26100.0" /m

      # Build Kernel Drivers (x64, ARM64 Only)
      - name: Build Kernel Drivers
        shell: cmd
        working-directory: libusbK
        run: |
          echo === Building x64 Driver (.sys) ===
          msbuild src\sys\libusbK_sys.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="10.0.26100.0" /p:DriverTargetPlatform="Windows Driver" /m

          echo === Building ARM64 Driver (.sys) ===
          msbuild src\sys\libusbK_sys.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="10.0.26100.0" /p:DriverTargetPlatform="Windows Driver" /m

      # Securely Export Build Output Binaries
      - name: Collect and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libusbK-WDK26100-Output
          path: |
            libusbK\**\Output\**\*.dll
            libusbK\**\Output\**\*.lib
            libusbK\**\Output\**\*.sys
            libusbK\**\Output\**\*.inf
            libusbK\**\Output\**\*.cat
          if-no-files-found: error

name: libusbK builds with EWDK

on: [push, pull_request]

jobs:
  build-all:
    name: Build All Targets (EWDK 26100)
    runs-on: windows-2022
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

    # Step 1: Download and cache the EWDK ISO
      - name: Cache EWDK ISO
        id: cache-ewdk
        uses: actions/cache@v4
        with:
          path: C:\EWDK_ISO
          key: ewdk-26100-v1

      - name: Download EWDK ISO via Curl
        if: steps.cache-ewdk.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\EWDK_ISO
          
          # 1. Resolve the fwlink redirect to get the true, direct Microsoft download URL
          $ShortUrl = "https://go.microsoft.com/fwlink/?linkid=2271831"
          Write-Output "Resolving Microsoft shortlink..."
          $Request = [System.Net.WebRequest]::Create($ShortUrl)
          $Request.Method = "HEAD"
          $Response = $Request.GetResponse()
          $DirectUrl = $Response.ResponseUri.AbsoluteUri
          $Response.Close()
          Write-Output "Resolved target address: $DirectUrl"

          # 2. Stream the true large payload directly down using curl.exe
          Write-Output "Streaming multi-gigabyte ISO payload via native curl..."
          curl.exe -L -o "C:\EWDK_ISO\EWDK.iso" "$DirectUrl"

          # 3. Sanity check validation
          $file = Get-Item "C:\EWDK_ISO\EWDK.iso"
          $sizeGB = ($file.Length / 1GB).ToString("F2")
          Write-Output "Downloaded clean image file size: $sizeGB GB"
          
          if ($file.Length -lt 2GB) {
              throw "Download payload size error ($sizeGB GB). The target package was truncated or blocked."
          }

      # Step 2: Mount the ISO safely, clearing any stale loops
      - name: Mount EWDK ISO
        id: mount-iso
        shell: powershell
        run: |
          $IsoPath = "C:\EWDK_ISO\EWDK.iso"
          
          # Clean up any leftover mounts from interrupted runs
          Get-DiskImage -ImagePath $IsoPath | Dismount-DiskImage -ErrorAction SilentlyContinue
          
          Write-Output "Mounting validated EWDK environment image..."
          $MountDrive = (Mount-DiskImage -ImagePath $IsoPath -PassThru | Get-Volume).DriveLetter
          
          if (-not $MountDrive) {
              throw "Failed to acquire a valid Virtual Drive Letter from the EWDK ISO image."
          }
          
          echo "EWDK_DRIVE=${MountDrive}:" >> $env:GITHUB_ENV
          Write-Output "EWDK safely mapped to virtual volume ${MountDrive}:"

      # Step 3: Compile Libraries (x86, x64, ARM64) using the EWDK environment
      - name: Build User-space Libraries
        shell: cmd
        run: |
          :: Enter the EWDK environment and pass the build commands
          call "%EWDK_DRIVE%\LaunchBuildEnv.cmd" && (
            
            echo === Building x86 Library ===
            msbuild ./libusbK/libusbK.sln /p:Configuration=Release /p:Platform=Win32 /t:libusbK_dll;libusbK_static /m
            
            echo === Building x64 Library ===
            msbuild ./libusbK/libusbK.sln /p:Configuration=Release /p:Platform=x64 /t:libusbK_dll;libusbK_static /m
            
            echo === Building ARM64 Library ===
            msbuild ./libusbK/libusbK.sln /p:Configuration=Release /p:Platform=ARM64 /t:libusbK_dll;libusbK_static /m
          )

      # Step 4: Compile Drivers (x64, ARM64) using the EWDK environment
      - name: Build Drivers
        shell: cmd
        run: |
          call "%EWDK_DRIVE%\LaunchBuildEnv.cmd" && (
            
            echo === Building x64 Driver ===
            msbuild ./libusbK/libusbK.sln /p:Configuration=Release /p:Platform=x64 /p:DriverTargetPlatform="Universal" /t:libusbK_sys /m
            
            echo === Building ARM64 Driver ===
            msbuild ./libusbK/libusbK.sln /p:Configuration=Release /p:Platform=ARM64 /p:DriverTargetPlatform="Universal" /t:libusbK_sys /m
          )

      # Step 5: Clean up by unmounting the ISO image
      - name: Dismount EWDK ISO
        if: always()
        shell: powershell
        run: |
          Dismount-DiskImage -ImagePath "C:\EWDK_ISO\EWDK.iso"

      # Step 6: Package Binaries
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libusbK-EWDK-Output
          path: |
            **\Output\**\*.dll
            **\Output\**\*.lib
            **\Output\**\*.sys
            **\Output\**\*.inf
            **\Output\**\*.cat
          if-no-files-found: error

name: libusbK builds with nuget WDK

on: [push, pull_request]

jobs:
  build-project:
    name: Build (${{ matrix.os }} - ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows Server 2022 (VS2022 Baseline) ---
          - os: "windows-2022"
            platform: "Win32"
            wdk_version: "10.0.26100.2454"
            target_version: "10.0.26100.0"
          - os: "windows-2022"
            platform: "x64"
            wdk_version: "10.0.26100.2454"
            target_version: "10.0.26100.0"
          - os: "windows-2022"
            platform: "ARM64"
            wdk_version: "10.0.26100.2454"
            target_version: "10.0.26100.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup MSBuild Configuration
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet Environment
        uses: NuGet/setup-nuget@v3

      - name: Restore WDK Packages & Build Elements
        shell: powershell
        working-directory: libusbK
        run: |
          nuget install Microsoft.Windows.WDK.x64 -Version "${{ matrix.wdk_version }}" -OutputDirectory packages
          nuget install Microsoft.Windows.SDK.CPP.x64 -Version "${{ matrix.wdk_version }}" -OutputDirectory packages

      # Build User-space Libraries
      # Overrode WindowsTargetPlatformVersion & WindowsSDKVersion to force MSBuild to skip local disk checks
      - name: Build User Libraries
        shell: cmd
        working-directory: libusbK
        run: |
          echo === Building User Space Libs ===
          msbuild src\lib\libusbK_lib.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:TargetVersion="Windows10" /p:TargetPlatformVersion="${{ matrix.target_version }}" /p:WindowsTargetPlatformVersion="${{ matrix.target_version }}" /p:WindowsSDKVersion="${{ matrix.target_version }}\" /m

      # Build Kernel Drivers (x64, ARM64 Only)
      - name: Build Kernel Drivers
        if: matrix.platform != 'Win32'
        shell: cmd
        working-directory: libusbK
        run: |
          echo === Building Driver (.sys) ===
          msbuild src\sys\libusbK_sys.vcxproj /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /p:TargetVersion="Windows10" /p:TargetPlatformVersion="${{ matrix.target_version }}" /p:ApiValidatorAnalyze=false /p:InfVerif=false /p:AdditionalIncludeDirectories="%CD%\packages\Microsoft.Windows.WDK.x64.${{ matrix.wdk_version }}\build\native\include" /m

      # Securely Export Build Output Binaries
      - name: Collect and Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libusbK-${{ matrix.os }}-${{ matrix.platform }}-Output
          path: |
            libusbK/**/*.dll
            libusbK/**/*.lib
            libusbK/**/*.sys
            libusbK/**/*.inf
            libusbK/**/*.cat
          if-no-files-found: error
